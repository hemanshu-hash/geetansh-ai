<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090806" />
    <meta name="description" content="Hemanshu AI — your personal AI assistant." />
    <title>Hemanshu AI</title>
    <link rel="icon" type="image/svg+xml" href="hemanshu-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="brand-emblem" aria-hidden="true">H</span><span>hemanshu<span class="brand-light">.ai</span></span></div>
        <button class="new-chat" id="newChat"><span class="plus">＋</span> New chat <kbd>⌘ K</kbd></button>
        <div class="side-label">YOUR SPACE</div>
        <div class="history-list" id="historyList"></div>
        <div class="sidebar-bottom"><button class="profile-button" id="profileButton"><span class="profile-avatar" id="profileAvatar">H</span><span class="profile-copy"><strong id="profileName">Hemanshu</strong><span>Personal workspace · Settings</span></span></button><button class="profile-menu" id="profileMenu" aria-label="Profile settings">···</button></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="menuButton" aria-label="Open menu">☰</button>
          <div class="mobile-brand"><span class="brand-emblem" aria-hidden="true">H</span><strong>hemanshu<span class="brand-light">.ai</span></strong></div>
          <div class="topbar-brand"><button class="model-pill" id="modelButton"><span class="status-dot"></span> Hemanshu AI <span class="chevron">⌄</span></button><span class="provider-name" id="providerName">Checking connection</span></div>
          <button class="header-action" id="chatActionsButton" aria-label="Conversation actions" title="Conversation actions">···</button>
          <button class="share-button" id="shareButton"><span>↗</span> Share</button>
        </header>
        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-orb" aria-label="Hemanshu AI emblem"><span class="welcome-monogram">H<span>.</span></span><i class="spark spark-one">✳</i><i class="spark spark-two">✦</i></div>
            <p class="eyebrow">YOUR PERSONAL ASSISTANT</p>
            <h1>Good to see you,<br /><span id="welcomeName">Hemanshu.</span></h1>
            <p class="welcome-sub">A little curiosity can take you anywhere.<br class="desktop-break" /> What’s on your mind?</p>
            <div class="suggestions">
              <button class="suggestion" data-prompt="Give me a simple plan to have a more productive day"><span class="suggestion-icon lilac">◷</span><span><strong>Plan my day</strong><small>Make a simple routine that works</small></span><span class="suggestion-arrow">↗</span></button>
              <button class="suggestion" data-prompt="Teach me something fascinating in a few sentences"><span class="suggestion-icon peach">✳</span><span><strong>Teach me something</strong><small>A new idea, made easy to get</small></span><span class="suggestion-arrow">↗</span></button>
              <button class="suggestion" data-prompt="Help me brainstorm a creative project idea"><span class="suggestion-icon mint">⌁</span><span><strong>Get creative</strong><small>Let’s make something interesting</small></span><span class="suggestion-arrow">↗</span></button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>
        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <div class="attachments" id="attachments"></div>
            <textarea id="messageInput" rows="1" placeholder="Ask Hemanshu AI anything..." aria-label="Message Hemanshu AI"></textarea>
            <div class="composer-tools"><span class="demo-note"><span class="demo-dot"></span> Demo mode</span><div class="tool-actions"><button type="button" class="tool-button" id="attachButton" aria-label="Attach file">＋</button><button type="submit" class="send-button" id="sendButton" aria-label="Send message">↑</button></div></div>
          </form>
          <p class="disclaimer" id="connectionStatus">Checking AI connection…</p>
          <input type="file" id="attachmentInput" accept="image/*,.txt,.md,.pdf,.doc,.docx,.csv" hidden multiple />
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
